# 由 tool/logo_master.png（启动页 "Near." 母图）生成各平台 App 图标。
# 母图来源：flutter test tool/render_logo.dart
# 跑法：dart run flutter_launcher_icons
#
# Windows 本地无 windows/ 目录（CI 现生成，见 CLAUDE.md），故此处不开 windows；
# Windows 图标走 tool/app_icon.ico + .github/workflows 注入。
flutter_launcher_icons:
  image_path: "tool/logo_master.png"
  # Android：覆盖 legacy mipmap；同时生成 adaptive（背景纯白，前景=母图）
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "tool/logo_fg.png"
  min_sdk_android: 21
  # macOS：覆盖 AppIcon.appiconset 各尺寸
  macos:
    generate: true
    image_path: "tool/logo_master.png"
  ios: false
